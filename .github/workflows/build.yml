name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false
          cache-disabled: true

      - name: Prepare Secrets, Keystore & Google Services
        run: |
          # 1. Provide .env files required by Secrets Gradle plugin
          touch .env
          touch .env.example

          # 2. Re-create debug.keystore
          rm -f debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. google-services.json: the real file is committed in the repo.
          #    Write the placeholder only if no file is present.
          if [ ! -f app/google-services.json ]; then
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "bwriter-app",
              "storage_bucket": "bwriter-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                  "android_client_info": {
                    "package_name": "com.supernatural.bwriter"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly123456789"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Assemble Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-configuration-cache \
            --no-build-cache \
            -x test \
            -x lint \
            -x verifyRoborazziDebug \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bwriter-Divine-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Restore Upload Key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      - name: Assemble Release Bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:bundleRelease \
            --no-configuration-cache \
            --no-build-cache \
            -x test \
            -x lint \
            --stacktrace

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Bwriter-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

          
