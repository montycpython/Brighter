<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bwriter: Phoenicia</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1B1B1F">
  <!-- Firebase web SDK (modular v11) from the Firebase CDN. Exposes the app,
       auth and Firestore functions the Kotlin/Wasm interop layer calls as
       window.BwriterFirebase and window.BwriterFirestore.
       Order matters: module scripts and deferred scripts execute in document
       order after parsing, so this block must stay before webApp.js. -->
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script type="module">
    import { initializeApp, getApp } from "https://www.gstatic.com/firebasejs/11.13.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.13.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      getDoc,
      query,
      where,
      updateDoc,
      setDoc,
      addDoc
    } from "https://www.gstatic.com/firebasejs/11.13.0/firebase-firestore.js";
    window.BwriterFirebase = {
      initializeApp,
      getApp,
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    };
    window.BwriterRandom = {
      hex32: () => {
        const a = new Uint8Array(32);
        crypto.getRandomValues(a);
        return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
      }
    };
    const bwriterB64 = {
      enc: (bytes) => {
        let s = '';
        bytes.forEach((b) => { s += String.fromCharCode(b); });
        return btoa(s);
      },
      dec: (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0))
    };
    const bwriterHex = (bytes) =>
      Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
    async function bwriterDerive(passphrase, salt, iter) {
      const base = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
    window.BwriterCrypto = {
      sealKey: async (passphrase, scalarHex, address) => {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await bwriterDerive(passphrase, salt, 200000);
        const scalar = Uint8Array.from(
          scalarHex.match(/../g), (h) => parseInt(h, 16));
        const sealed = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv: iv, tagLength: 128 }, key, scalar);
        return JSON.stringify({
          v: 1,
          kdf: 'PBKDF2-HMAC-SHA256',
          iter: 200000,
          form: 'ec-private-scalar-32',
          salt: bwriterB64.enc(salt),
          iv: bwriterB64.enc(iv),
          data: bwriterB64.enc(new Uint8Array(sealed)),
          address: address
        });
      },
      openKey: async (passphrase, json) => {
        try {
          const root = JSON.parse(json);
          const key = await bwriterDerive(
            passphrase, bwriterB64.dec(root.salt), root.iter || 200000);
          const opened = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: bwriterB64.dec(root.iv), tagLength: 128 },
            key, bwriterB64.dec(root.data));
          const bytes = new Uint8Array(opened);
          if (bytes.length !== 32) return '';
          return bwriterHex(bytes);
        } catch (e) {
          return '';
        }
      }
    };
    window.BwriterVaultStore = {
      get: (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } },
      remove: (k) => { try { localStorage.removeItem(k); } catch (e) { } }
    };
    window.BwriterSync = {
      saveAll: async (opsJson) => {
        const F = window.BwriterFirestore;
        const db = F.getFirestore(F.getApp());
        const ops = JSON.parse(opsJson);
        for (const op of ops) {
          if (op.add) {
            await F.addDoc(F.collection(db, op.path), op.data);
          } else {
            await F.setDoc(F.doc(db, ...op.path.split('/')), op.data);
          }
        }
      }
    };
    window.BwriterDriveTokens = { token: '', expiresAt: 0 };
    let bwriterTokenClient = null;
    let bwriterTokenWaiter = null;
    function bwriterDriveToken() {
      if (window.BwriterDriveTokens.token &&
          Date.now() < window.BwriterDriveTokens.expiresAt) {
        return Promise.resolve(window.BwriterDriveTokens.token);
      }
      if (bwriterTokenWaiter) return bwriterTokenWaiter;
      bwriterTokenWaiter = new Promise((resolve) => {
        const finish = (token) => { bwriterTokenWaiter = null; resolve(token); };
        if (!window.google || !google.accounts || !google.accounts.oauth2) {
          finish('');
          return;
        }
        try {
          if (!bwriterTokenClient) {
            bwriterTokenClient = google.accounts.oauth2.initTokenClient({
              client_id: '200758170739-868t5p0ij0tq59kko5in839206mkcrfe.apps.googleusercontent.com',
              scope: 'https://www.googleapis.com/auth/drive.file',
              callback: (resp) => {
                if (resp && resp.access_token) {
                  window.BwriterDriveTokens.token = resp.access_token;
                  window.BwriterDriveTokens.expiresAt =
                    Date.now() + ((resp.expires_in || 3600) - 60) * 1000;
                  finish(resp.access_token);
                } else {
                  finish('');
                }
              },
              error_callback: () => finish('')
            });
          }
          bwriterTokenClient.requestAccessToken({ prompt: '' });
        } catch (e) {
          finish('');
        }
      });
      return bwriterTokenWaiter;
    }
    const DRIVE_FILES = 'https://www.googleapis.com/drive/v3/files';
    const DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
    async function driveHttp(method, url, token, body, contentType) {
      const headers = { Authorization: 'Bearer ' + token };
      if (contentType) headers['Content-Type'] = contentType;
      const resp = await fetch(url, {
        method: method, headers: headers, body: body || undefined
      });
      return { code: resp.status, text: await resp.text() };
    }
    async function driveFindFolder(token) {
      const q = encodeURIComponent(
        "mimeType = 'application/vnd.google-apps.folder' and name = 'Bwriter' and trashed = false");
      const r = await driveHttp('GET', DRIVE_FILES + '?q=' + q + '&fields=files(id,name)', token);
      if (r.code < 200 || r.code >= 300) return '';
      const files = (JSON.parse(r.text).files) || [];
      return files.length ? (files[0].id || '') : '';
    }
    async function driveEnsureFolder(token) {
      const existing = await driveFindFolder(token);
      if (existing) return existing;
      const meta = JSON.stringify({
        name: 'Bwriter', mimeType: 'application/vnd.google-apps.folder'
      });
      const r = await driveHttp('POST', DRIVE_FILES, token, meta, 'application/json');
      if (r.code < 200 || r.code >= 300) {
        throw new Error('Drive folder create failed (' + r.code + ')');
      }
      return JSON.parse(r.text).id || '';
    }
    async function driveFindBookFile(token, folderId, birthId) {
      const raw = "appProperties has { key='birthId' and value='" + birthId +
        "' } and '" + folderId + "' in parents and trashed = false";
      const r = await driveHttp(
        'GET', DRIVE_FILES + '?q=' + encodeURIComponent(raw) + '&fields=files(id,name)', token);
      if (r.code < 200 || r.code >= 300) return '';
      const files = (JSON.parse(r.text).files) || [];
      return files.length ? (files[0].id || '') : '';
    }
    function driveSanitize(title) {
      const cleaned = (title || '')
        .replace(/[\\\/:*?"<>|]/g, ' ').trim().replace(/\s+/g, ' ');
      return cleaned || 'Untitled Book';
    }
    function driveUpdatedAt(payload) {
      const m = /"updatedAt"\s*:\s*(\d+)/.exec(payload || '');
      return m ? parseInt(m[1], 10) : 0;
    }
    window.BwriterDrive = {
      warm: () => { bwriterDriveToken(); },
      saveBook: async (birthId, title, payload) => {
        const token = await bwriterDriveToken();
        if (!token) return 'Google Drive access not granted.';
        try {
          const folderId = await driveEnsureFolder(token);
          if (!folderId) return 'Drive folder unavailable.';
          const existingId = await driveFindBookFile(token, folderId, birthId);
          if (existingId) {
            const dl = await driveHttp(
              'GET', DRIVE_FILES + '/' + existingId + '?alt=media', token);
            if (dl.code >= 200 && dl.code < 300 && dl.text) {
              if (driveUpdatedAt(dl.text) > driveUpdatedAt(payload)) {
                return "Drive copy of '" + title +
                  "' is newer than this browser copy. Restore it before syncing.";
              }
            }
            const patch = await driveHttp(
              'PATCH', DRIVE_UPLOAD + '/' + existingId + '?uploadType=media',
              token, payload, 'application/json');
            if (patch.code < 200 || patch.code >= 300) {
              return 'Drive update failed (' + patch.code + ')';
            }
            return '';
          }
          const metadata = JSON.stringify({
            name: driveSanitize(title) + '.json',
            mimeType: 'application/json',
            parents: [folderId],
            appProperties: { app: 'bwriter', birthId: birthId }
          });
          const boundary = 'bwriter-' + Date.now();
          const body = '--' + boundary + '\r\n' +
            'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
            metadata + '\r\n' +
            '--' + boundary + '\r\n' +
            'Content-Type: application/json\r\n\r\n' +
            payload + '\r\n' +
            '--' + boundary + '--';
          const created = await driveHttp(
            'POST', DRIVE_UPLOAD + '?uploadType=multipart',
            token, body, 'multipart/related; boundary=' + boundary);
          if (created.code < 200 || created.code >= 300) {
            return 'Drive create failed (' + created.code + ')';
          }
          if (!JSON.parse(created.text).id) {
            return 'Drive create returned no file id';
          }
          return '';
        } catch (e) {
          return 'Drive save failed: ' + (e && e.message ? e.message : 'unknown');
        }
      }
    };
    async function driveFindFileByName(token, folderId, name) {
      const raw = "name = '" + name + "' and '" + folderId +
        "' in parents and trashed = false";
      const r = await driveHttp(
        'GET', DRIVE_FILES + '?q=' + encodeURIComponent(raw) + '&fields=files(id,name)', token);
      if (r.code < 200 || r.code >= 300) return '';
      const files = (JSON.parse(r.text).files) || [];
      return files.length ? (files[0].id || '') : '';
    }
    window.BwriterDriveRestore = {
      downloadAllPayloads: async () => {
        const token = await bwriterDriveToken();
        if (!token) return [];
        const folderId = await driveFindFolder(token);
        if (!folderId) return [];
        const payloads = [];
        let pageToken = '';
        do {
          const q = encodeURIComponent(
            "'" + folderId + "' in parents and trashed = false");
          let url = DRIVE_FILES + '?q=' + q +
            '&fields=nextPageToken,files(id,name)&pageSize=100';
          if (pageToken) url += '&pageToken=' + encodeURIComponent(pageToken);
          const r = await driveHttp('GET', url, token);
          if (r.code < 200 || r.code >= 300) break;
          const root = JSON.parse(r.text);
          const files = root.files || [];
          for (const f of files) {
            if (f.name === 'bwriter-author-key.json') continue;
            if (!f.id) continue;
            const dl = await driveHttp(
              'GET', DRIVE_FILES + '/' + f.id + '?alt=media', token);
            if (dl.code >= 200 && dl.code < 300 && dl.text) {
              payloads.push(dl.text);
            }
          }
          pageToken = root.nextPageToken || '';
        } while (pageToken);
        return payloads;
      },
      downloadKeyBackup: async () => {
        const token = await bwriterDriveToken();
        if (!token) return '';
        const folderId = await driveFindFolder(token);
        if (!folderId) return '';
        const fileId = await driveFindFileByName(
          token, folderId, 'bwriter-author-key.json');
        if (!fileId) return '';
        const dl = await driveHttp(
          'GET', DRIVE_FILES + '/' + fileId + '?alt=media', token);
        return (dl.code >= 200 && dl.code < 300) ? dl.text : '';
      },
      uploadKeyBackup: async (json) => {
        const token = await bwriterDriveToken();
        if (!token) return 'Google Drive access not granted.';
        try {
          const folderId = await driveEnsureFolder(token);
          if (!folderId) return 'Drive folder unavailable.';
          const existingId = await driveFindFileByName(
            token, folderId, 'bwriter-author-key.json');
          if (existingId) {
            const patch = await driveHttp(
              'PATCH', DRIVE_UPLOAD + '/' + existingId + '?uploadType=media',
              token, json, 'application/json');
            if (patch.code < 200 || patch.code >= 300) {
              return 'Key backup update failed (' + patch.code + ')';
            }
            return '';
          }
          const metadata = JSON.stringify({
            name: 'bwriter-author-key.json',
            mimeType: 'application/json',
            parents: [folderId]
          });
          const boundary = 'bwriter-' + Date.now();
          const body = '--' + boundary + '\r\n' +
            'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
            metadata + '\r\n' +
            '--' + boundary + '\r\n' +
            'Content-Type: application/json\r\n\r\n' +
            json + '\r\n' +
            '--' + boundary + '--';
          const created = await driveHttp(
            'POST', DRIVE_UPLOAD + '?uploadType=multipart',
            token, body, 'multipart/related; boundary=' + boundary);
          if (created.code < 200 || created.code >= 300) {
            return 'Key backup create failed (' + created.code + ')';
          }
          if (!JSON.parse(created.text).id) {
            return 'Key backup create returned no file id';
          }
          return '';
        } catch (e) {
          return 'Key backup failed: ' + (e && e.message ? e.message : 'unknown');
        }
      }
    };
    window.BwriterFirestore = {
      getFirestore,
      collection,
      getDocs,
      doc,
      getDoc,
      query,
      where,
      updateDoc,
      setDoc,
      addDoc
    };
  </script>
  <!-- KaTeX from the jsDelivr CDN. The browser LaTeX renderer: the shared
       parser hands the web reader the same math segments Android renders
       with JLatexMath. Exposed as window.BwriterKatex before webApp.js. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script>
    window.BwriterKatex = {
      renderToString: (tex, displayMode) =>
        window.katex.renderToString(tex, { displayMode: displayMode, throwOnError: false })
    };
  </script>
  <script>
    // Bwriter is compiled to WebAssembly with garbage collection, which
    // needs a current engine — on iPhone, iOS 18.4 or later. The probe
    // below validates a tiny module that only a WasmGC engine accepts,
    // so an older browser gets a legible word instead of a blank page.
    window.__bwriterWasmOk = (function () {
      try {
        if (!window.WebAssembly || !WebAssembly.validate) return false;
        var bytes = new Uint8Array(
          [0, 97, 115, 109, 1, 0, 0, 0, 1, 3, 1, 0x5f, 0]);
        return WebAssembly.validate(bytes);
      } catch (e) {
        return false;
      }
    })();
  </script>
</head>
<body>
  <div id="bwriter-fallback"
       style="display:none; font-family: Georgia, 'Times New Roman', serif; color: #1D1D1F; padding: 72px 28px; text-align: center;">
    <div style="font-size: 30px; font-weight: bold;">Bwriter</div>
    <p id="bwriter-fallback-text"
       style="font-size: 17px; line-height: 27px; max-width: 520px; margin: 18px auto 0; color: #3A3A3C;">
      Bwriter needs a newer browser to run. On an iPhone, that means
      iOS 18.4 or later — please update iOS, or open Bwriter in the
      latest Safari, Chrome, or Firefox on a computer. Your books and
      your account are untouched.
    </p>
  </div>
  <script>
    (function () {
      var fallback = document.getElementById('bwriter-fallback');
      if (window.__bwriterWasmOk) {
        var s = document.createElement('script');
        s.src = 'webApp.js';
        document.body.appendChild(s);
        new MutationObserver(function () {
          if (document.querySelector('canvas')) {
            fallback.style.display = 'none';
          }
        }).observe(document.body, { childList: true, subtree: true });
        setTimeout(function () {
          if (!document.querySelector('canvas')) {
            document.getElementById('bwriter-fallback-text').textContent =
              'Bwriter is taking a long time to load. A slow connection ' +
              'can do this — or the browser may be too old. On an ' +
              'iPhone, Bwriter needs iOS 18.4 or later.';
            fallback.style.display = 'block';
          }
        }, 25000);
      } else {
        fallback.style.display = 'block';
      }
    })();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</body>
</html>
