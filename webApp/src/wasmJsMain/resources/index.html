<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bwriter: Phoenicia</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1B1B1F">
  <!-- Firebase web SDK (modular v11) from the Firebase CDN. Exposes the six
       functions the Kotlin/Wasm interop layer calls as window.BwriterFirebase.
       Order matters: module scripts and deferred scripts execute in document
       order after parsing, so this block must stay before webApp.js. -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.13.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.13.0/firebase-auth.js";
    window.BwriterFirebase = {
      initializeApp,
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    };
  </script>
  <script defer src="webApp.js"></script>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</body>
</html>
